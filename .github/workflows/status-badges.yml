name: 📊 Status Badges Update

on:
  workflow_run:
    workflows: ["🔍 Verification Pipeline", "🎯 Truth Scoring Pipeline", "🔗 Cross-Agent Integration Tests"]
    types: [completed]
  push:
    branches: [main]
  # DISABLED: daily cron removed - workflow_run trigger is sufficient
  # schedule:
  #   - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  update-badges:
    name: 📊 Update Status Badges
    runs-on: [self-hosted, avm-02]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate badge data
        run: |
          echo "📊 Generating badge data..."
          mkdir -p badge-data
          VERIFICATION_STATUS="${{ github.event.workflow_run.conclusion || 'unknown' }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name || 'unknown' }}"
          case "$VERIFICATION_STATUS" in
            "success") BADGE_COLOR="brightgreen"; BADGE_STATUS="passing" ;;
            "failure") BADGE_COLOR="red"; BADGE_STATUS="failing" ;;
            *) BADGE_COLOR="yellow"; BADGE_STATUS="unknown" ;;
          esac
          cat > badge-data/status.json << EOF
          {"schemaVersion":1,"label":"pipeline","message":"$BADGE_STATUS","color":"$BADGE_COLOR","style":"flat-square"}
          EOF

      - name: Upload badge data
        uses: actions/upload-artifact@v4
        with:
          name: badge-data
          path: badge-data/
          retention-days: 7
